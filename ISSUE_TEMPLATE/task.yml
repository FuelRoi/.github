name: Task
description: One-off work that isn't a slice
type: Task
projects: ["FuelRoi/1"]
body:
  - type: markdown
    attributes:
      value: |
        A **Task** is work that doesn't give anyone something new to use: setup, upgrades, config, research.
        After creating it: set **Area**, **Priority**, and **Effort**. If it supports a Feature, add it as a sub-issue there.
  - type: textarea
    id: what
    attributes:
      label: What
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      value: |
        - [ ]
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, commands, or anything future-you will want.
