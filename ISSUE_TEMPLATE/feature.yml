name: Feature
description: A larger piece of work made of slices
type: Feature
projects: ["FuelRoi/1"]
body:
  - type: markdown
    attributes:
      value: |
        A **Feature** is a larger piece of work broken into **Slices** (and sometimes Tasks) as sub-issues.
        After creating it: set **Area** and **Priority**, add **Start date** and **Target date** on the Work board, then add slices under **Sub-issues**.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What hurts today, for whom, and what it costs. One paragraph.
    validations:
      required: true
  - type: textarea
    id: in-scope
    attributes:
      label: In scope
      description: What this feature includes.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What it explicitly does not include. This list protects the timeline.
      value: |
        -
  - type: textarea
    id: design
    attributes:
      label: Design notes
      description: Tables, screens, routes, and links to docs/DESIGN.md.
